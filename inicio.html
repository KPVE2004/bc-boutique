<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inicia Sesión</title>
    <link rel="icon" href="./img/lsf.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poiret+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Poiret+One&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Afacad&display=swap" rel="stylesheet">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Aboreto', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        
        /* Fondo con imagen y overlay */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background: url(./img/modelos.jpg) no-repeat right center;
            background-size: contain;
            z-index: -2;
        }
        
        /* Capa degradada */
        body::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, #e7e3dd, #E9DBC5);
            opacity: 0.6;
            z-index: -1;
        }
        
        .login-container {
            background-color: white;
            width: 300px;
            padding: 30px;
            margin-left: 200px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            z-index: 1;
        }
        
        .logo {
            display: block;
            width: 120px;
            margin: 0 auto 25px auto;
            margin-bottom: 1.5cm;
        }
        
        h1 {
            color: #333;
            text-align: left;
            margin-bottom: 25px;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .input-group {
            margin-bottom: 18px;
        }
        
        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 11px;
            letter-spacing: 1px;
        }
        
        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 0;
            box-sizing: border-box;
            font-size: 13px;
        }
        
        .forgot-password {
            text-align: right;
            margin-bottom: 25px;
            font-family: 'Afacad', sans-serif;
        }
        
        .forgot-password a {
            color: #333;
            text-decoration: none;
            font-size: 15px;
            text-transform: uppercase;
        }
        
        .button-container {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }
        
        .login-button {
            background-color: black;
            color: white;
            border: none;
            padding: 16px 50px;
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: background-color 0.3s;
            text-align: center;
            text-decoration: none;
            width: auto;
            min-width: 200px;
        }
        
        .login-button:hover {
            background-color: #333;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <img src="./img/lsf2.png" alt="Logo" class="logo">
        <h1>Inicia sesión</h1>
        
        <div class="input-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="input-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required>
        </div>
        
        <div class="forgot-password">
            <a href="#">¿Has olvidado tu contraseña?</a>
        </div>
        
        <div class="button-container">
            <a href="./index.html" class="login-button">Iniciar sesión</a>
        </div>
    </div>
</body>
</html>
